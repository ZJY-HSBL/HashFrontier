name: STOC25 Algorithms 4 and 5 conditional retrieval correctness gate
on:
  push:
    branches: [main]
    paths:
      - 'include/hashfrontier/partner_ram_section3.hpp'
      - 'include/hashfrontier/partner_retrieval_section3.hpp'
      - 'tests/test_partner_retrieval_section3.cpp'
      - '.github/workflows/partner-retrieval-v016-cloud.yml'
      - 'src/bench_partner_retrieval_section3.cpp'
      - 'scripts/report_partner_retrieval_v016.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-retrieval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce restricted Algorithm 4/5 tests
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run address and undefined behavior checks
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_partner_retrieval_section3.cpp -o /tmp/hf-partner-retrieval-asan
          ASAN_OPTIONS=detect_leaks=1 /tmp/hf-partner-retrieval-asan

      - name: Execute actual 60-case conditional cloud pilot
        run: |
          set -euo pipefail
          mkdir -p results/v0.16.0-partner-retrieval figures
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Iinclude src/bench_partner_retrieval_section3.cpp -o /tmp/partner-retrieval-bench
          /tmp/partner-retrieval-bench 5 > results/v0.16.0-partner-retrieval/cloud-raw.csv
          python3 scripts/report_partner_retrieval_v016.py --raw results/v0.16.0-partner-retrieval/cloud-raw.csv --out results/v0.16.0-partner-retrieval
          cp results/v0.16.0-partner-retrieval/update.svg figures/v0.16.0-partner-retrieval-update.svg
          cp results/v0.16.0-partner-retrieval/query.svg figures/v0.16.0-partner-retrieval-query.svg
          { date -u +'%Y-%m-%dT%H:%M:%SZ'; uname -a; g++ --version | head -1; lscpu | grep -E 'Model name|Architecture|CPU\\(s\\)' | head -4; } > results/v0.16.0-partner-retrieval/environment.txt
          sha256sum include/hashfrontier/partner_ram_section3.hpp include/hashfrontier/partner_retrieval_section3.hpp results/v0.16.0-partner-retrieval/cloud-raw.csv > results/v0.16.0-partner-retrieval/sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stoc25-partner-alg45-v016-cloud
          path: |
            results/v0.16.0-partner-retrieval/
            figures/v0.16.0-partner-retrieval-*.svg
          if-no-files-found: warn
      - name: Commit real measured CSV and SVG for archiving
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v0.16.0-partner-retrieval figures/v0.16.0-partner-retrieval-*.svg
          git diff --cached --quiet || { git commit -m 'data: archive STOC25 Alg4/5 actual cloud observations'; git push origin HEAD:main; }
