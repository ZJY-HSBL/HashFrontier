name: Versioned release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test release commit
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s tests -p "test_native_audit.py" -v
          python3 -m unittest discover -s tests -p "test_paired_native.py" -v
          python3 -m unittest discover -s tests -p "test_cross_paper_report.py" -v
          python3 -m unittest discover -s tests -p "test_hf_score.py" -v
          python3 scripts/verify_l3_plan.py
          python3 -m unittest discover -s tests -p "test_reproduction_protocol.py" -v
      - name: Publish tagged source and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(cat VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; not overwriting immutable evidence."
          else
            case "$tag" in
            v0.18.0) assets=(results/v0.18.0-xor-cloud/raw.csv results/v0.18.0-xor-cloud/summary.csv results/v0.18.0-xor-cloud/audit.json results/v0.18.0-xor-cloud/environment.txt results/v0.18.0-xor-cloud/tests.log results/v0.18.0-xor-cloud/sha256.txt figures/v0.18.0-xor-retrieval.svg figures/v0.18.0-xor-update.svg docs/STOC25-PARTNER-XOR-DIAGNOSTIC-v0.18.0.md); title="Experimental XOR retrieval encoded in PartnerRAM; non-DMPP06 control, 18 real cloud tests" ;;
            v0.17.0) assets=(results/v0.17.0-partner-batch/raw.csv results/v0.17.0-partner-batch/summary.csv results/v0.17.0-partner-batch/audit.json results/v0.17.0-partner-batch/environment.txt results/v0.17.0-partner-batch/sha256.txt results/v0.17.0-partner-batch/tests.log figures/v0.17.0-partner-batch-success.svg figures/v0.17.0-partner-batch-attempt.svg docs/STOC25-PARTNER-BATCH-v0.17.0.md); title="STOC 2025 Algorithm 5 finite atomic partner-slot reuse real cloud measurements" ;;
            v0.16.0) assets=(results/v0.16.0-partner-retrieval/cloud-raw.csv results/v0.16.0-partner-retrieval/summary.csv results/v0.16.0-partner-retrieval/audit.json results/v0.16.0-partner-retrieval/environment.txt results/v0.16.0-partner-retrieval/sha256.txt figures/v0.16.0-partner-retrieval-update.svg figures/v0.16.0-partner-retrieval-query.svg docs/STOC25-PARTNER-RETRIEVAL-v0.16.0.md docs/STOC25-PARTNER-RESULTS-v0.16.0.md); title="STOC 2025 Algorithms 4-5 conditional prestate batch retrieval with 60 genuine cloud experiments" ;;
            v0.15.0) assets=(results/stoc25-partner-section3-2/raw.csv results/stoc25-partner-section3-2/summary.csv results/stoc25-partner-section3-2/audit.json results/stoc25-partner-section3-2/environment.txt results/stoc25-partner-section3-2/tests.log results/stoc25-partner-section3-2/sha256.txt figures/hit_ns_op.svg figures/ram_write_ns_attempt.svg figures/delete_ns_attempt.svg docs/STOC25-PARTNER-SECTION3-2-CLOUD-v0.15.0.md docs/STOC25-PARTNER-SECTION3-2-REPRODUCTION.md); title="STOC 2025 Partner Hashing Section 3.2 Algorithms 6 to 8 oracle-backed cloud experiment, explicitly partial" ;;
            v0.14.0) assets=(results/stoc25-partner-section3/raw.csv results/stoc25-partner-section3/summary.csv results/stoc25-partner-section3/audit.json results/stoc25-partner-section3/environment.txt results/stoc25-partner-section3/tests.log results/stoc25-partner-section3/source-and-data.sha256 figures/stoc25-partner-section3-read.svg figures/stoc25-partner-section3-write.svg docs/STOC25-PARTNER-RESULTS-v0.14.0.md docs/STOC25-PARTNER-REPRODUCTION.md); title="STOC 2025 Partner Hashing Section 3.1 isolated subroutine real cloud evidence (partial reproduction)" ;;
            v0.13.0) assets=(results/v0.13.0-tpht/raw/latency-L70-V8.csv results/v0.13.0-tpht/raw/latency-L85-V8.csv results/v0.13.0-tpht/raw/latency-L95-V8.csv results/v0.13.0-tpht/raw/latency-L85-V1.csv results/v0.13.0-tpht/raw/space-N100000.csv results/v0.13.0-tpht/raw/space-N200000.csv results/v0.13.0-tpht/environment.txt results/v0.13.0-tpht/upstream-tests.log results/v0.13.0-tpht/sha256.txt figures/v0.13.0-tpht-hit.svg figures/v0.13.0-tpht-space.svg docs/TPHT-CLOUD-MATRIX-v0.13.0.md); title="TPHT PVLDB native cloud 1216 real latency and memory observations" ;;
            v0.12.1) assets=(results/v0.12.1-zombie-long/completion.csv results/v0.12.1-zombie-long/native-complete-timings.csv results/v0.12.1-zombie-long/summary.csv results/v0.12.1-zombie-long/trace-integrity.csv results/v0.12.1-zombie-long/provenance.json results/v0.12.1-zombie-long/environment.txt results/v0.12.1-zombie-long/sha256.txt figures/v0.12.1-zombie-long-insert.svg docs/RESULTS-v0.12.1-ZOMBIE-LONG.md); title="SIGMOD Zombie Hashing author-native 320-cycle long churn and exact TRHM crash audit" ;;
            v0.12.0) assets=(results/v0.12.0-zombie-native/completion.csv results/v0.12.0-zombie-native/native-complete-timings.csv results/v0.12.0-zombie-native/summary.csv results/v0.12.0-zombie-native/trace-integrity.csv results/v0.12.0-zombie-native/provenance.json results/v0.12.0-zombie-native/environment.txt results/v0.12.0-zombie-native/sha256.txt figures/v0.12.0-zombie-native-insert.svg docs/RESULTS-v0.12.0-ZOMBIE.md); title="SIGMOD 2025 Zombie Hashing four-author-variant 36-run cloud evidence" ;;
            v0.11.1) assets=(results/v0.11.0-appendix-b-cloud-pilot.csv results/v0.11.0-appendix-b-summary.csv results/v0.11.0-appendix-b-provenance.json figures/v0.11.0-appendix-b-build.svg figures/v0.11.0-appendix-b-hit.svg docs/APPENDIX-B-CLOUD-REPRODUCTION-v0.11.0.md); title="SODA 2025 Appendix B independent GitHub cloud reproduction CI fix" ;;
            v0.11.0) assets=(results/v0.11.0-appendix-b-cloud-pilot.csv results/v0.11.0-appendix-b-summary.csv results/v0.11.0-appendix-b-provenance.json figures/v0.11.0-appendix-b-build.svg figures/v0.11.0-appendix-b-hit.svg docs/APPENDIX-B-CLOUD-REPRODUCTION-v0.11.0.md); title="SODA 2025 Appendix B choice-prime reproduction and measured cloud pilot" ;;
            v0.1.0) assets=(results/v0.1.0-local.csv results/v0.1.0-summary.csv); title="research baseline" ;;
            v0.2.0) assets=(results/v0.2.0-churn.csv results/v0.2.0-churn-summary.csv); title="churn cost and reproduction staging" ;;
            v0.3.0) assets=(results/v0.3.0-churn-ci.csv.gz results/v0.3.0-tail-ci.csv results/v0.3.0-tail.csv results/v0.3.0-summary.csv results/v0.3.0-paired.csv results/v0.3.0-environment.json results/v0.3.0-ci-runtime.txt); title="320-cycle bounded-repair falsification and author-native gate" ;;
            v0.4.0) assets=(results/v0.4.0-author-v03-audit/audit.csv results/v0.4.0-author-v03-audit/audit.json results/v0.4.0-author-v03-audit/native-cycles.csv results/v0.4.0-author-v03-audit/native-summary.csv figures/v0.4.0-native-insert-trends.svg figures/v0.4.0-native-phase-median.svg); title="native-paper-source completion audit and measured failure" ;;
            v0.5.0) assets=(results/v0.5.0-v04-incident.csv results/v0.5.0-v04-provenance.json figures/v0.5.0-v04-incident.svg); title="trace pairing infrastructure and high-load crash audit" ;;
            v0.6.0) assets=(scoring/protocol-v1.0.json scoring/PROTOCOL.md results/v0.6.0-data-readiness.json examples/hfscore/demo-score.json); title="strict seven-metric HF-Score protocol and data eligibility gates" ;;
            v0.7.0) assets=(papers/cross-paper-v0.7.0.md scoring/PROTOCOL.md); title="author-source cross-paper reproducible benchmark" ;;
            v0.7.1) assets=(papers/cross-paper-v0.7.0.md scoring/PROTOCOL.md); title="fixed author-source cross-paper benchmark" ;;
            v0.7.2) assets=(results/v0.7.1-cross-paper-observations.csv results/v0.7.1-cross-paper-completeness.csv results/v0.7.1-cross-paper-summary.csv results/v0.7.1-cross-paper-provenance.json results/v0.7.1-cross-paper-environment.txt results/v0.7.1-cross-paper-author-sha256.txt results/v0.7.1-cross-paper-traces-sha256.txt figures/v0.7.1-cross-paper.svg); title="first measured SIGMOD x PVLDB same-trace comparison" ;;
            v0.8.2) assets=(results/v0.8.1-dynamic-observations.csv results/v0.8.1-dynamic-completeness.csv results/v0.8.1-dynamic-summary.csv results/v0.8.1-static-observations.csv results/v0.8.1-static-completeness.csv results/v0.8.1-static-summary.csv results/v0.8.1-paired-timing.csv results/v0.8.1-provenance.json figures/v0.8.1-dynamic-comparison.svg figures/v0.8.1-static-comparison.svg); title="verified three-paper results and reproduction-boundary analysis" ;;
            v0.8.1) assets=(docs/BASIC-BUBBLE-UP.md); title="three-paper static/dynamic paired benchmark with failure audit" ;;
            v0.8.0) assets=(docs/BASIC-BUBBLE-UP.md); title="SODA 2025 basic bubble-up and three-paper same-trace comparison" ;;
            v0.9.0) assets=(results/v0.9.0-bubble-pilot.csv results/v0.9.0-bubble-summary.csv results/v0.9.0-provenance.json figures/v0.9.0-bubble-compare.svg papers/registry-v0.9.0.csv papers/SCREENING-2025-2026.md); title="SODA advanced bubble-up mechanism pilot and verified literature screening" ;;
            v0.9.1) assets=(results/v0.9.1-appendix-c-pilot.csv results/v0.9.1-appendix-c-summary.csv figures/v0.9.1-appendix-c-insert.svg figures/v0.9.1-appendix-c-rebuild.svg docs/APPENDIX-C-REPRODUCTION.md docs/NEXT-L2-L3-GATES.md); title="SODA Appendix C deletion mechanism and finite L1 validation" ;;
            v0.9.2) assets=(results/v0.9.2-tpht-native-latency.csv results/v0.9.2-tpht-native-space.csv results/v0.9.2-tpht-upstream-tests.log results/v0.9.2-tpht-ci-environment.txt results/v0.9.2-tpht-source-sha256.txt results/v0.9.2-tpht-measurements-sha256.txt results/v0.9.2-tpht-provenance.json figures/v0.9.2-tpht-native-hits.svg figures/v0.9.2-tpht-native-space.svg docs/TPHT-AUTHOR-NATIVE-PILOT.md); title="TPHT official source tests and native reduced-range benchmarks" ;;
            v0.10.0) assets=(docs/BENCHMARK-PROTOCOL-v1.0.md docs/BUBBLE-UP-L2-AUDIT-v0.10.0.md docs/REPRODUCTION-GATES-v0.10.0.md benchmarks/frozen-platform-v1.0.json benchmarks/experiment-plan-v1.0.json results/v0.10.0-bubble-theorem-audit.json results/v0.10.0-validation-summary.json); title="frozen target host prerequisites and paper reproduction audit" ;;
            *) echo "Unexpected version: $tag" >&2; exit 1 ;;
          esac
          if [ "$tag" = "v0.3.0" ]; then
            ./build/hf_churn_benchmark 6 320 64 results/v0.3.0-tail-ci.csv | gzip -9 > results/v0.3.0-churn-ci.csv.gz
            { c++ --version | head -n 1; uname -a; lscpu | grep -E 'Model name|Architecture|CPU\(s\)' | head -n 4; } > results/v0.3.0-ci-runtime.txt
            test "$(zcat results/v0.3.0-churn-ci.csv.gz | wc -l)" -eq 46081
            test "$(wc -l < results/v0.3.0-tail-ci.csv)" -eq 145
          fi
          if [ "$tag" = "v0.4.0" ]; then
            test "$(wc -l < results/v0.4.0-author-v03-audit/audit.csv)" -eq 5
            test "$(wc -l < results/v0.4.0-author-v03-audit/native-cycles.csv)" -eq 3463
            python3 - <<'PY_NATIVE'
          import csv
          with open('results/v0.4.0-author-v03-audit/audit.csv') as f:
              rows={r['variant']:r for r in csv.DictReader(f)}
          assert len(rows)==4
          assert all(rows[v]['complete']=='True' for v in ('RHM','GZHM','GZHM_ADAPTIVE'))
          assert rows['TRHM']['complete']=='False' and int(rows['TRHM']['completed_cycles'])==194
          PY_NATIVE
          fi
          if [ "$tag" = "v0.12.1" ]; then
            mkdir -p long-native-archive
            gh run download 40176343702 -n zombie-v0.12.1-long-native-raw -D long-native-archive
            test -f long-native-archive/results/v0.12.1-zombie-long/completion.csv
            test -f long-native-archive/native-long/L95/S101/TRHM/stdout.log
            tar -czf results/v0.12.1-zombie-long-raw-logs.tar.gz -C long-native-archive native-long
            assets+=(results/v0.12.1-zombie-long-raw-logs.tar.gz)
          fi
          if [ "$tag" = "v0.12.0" ]; then
            mkdir -p source-native-archive
            gh run download 40175879142 -n zombie-v0.12.0-native-raw-and-audit -D source-native-archive
            test -f source-native-archive/results/v0.12.0-zombie-native/completion.csv
            test -f source-native-archive/native-logs/L95/S103/TRHM/churn_thrput.txt
            tar -czf results/v0.12.0-zombie-native-raw-logs.tar.gz -C source-native-archive native-logs
            assets+=(results/v0.12.0-zombie-native-raw-logs.tar.gz)
          fi
          if [ "$tag" = "v0.7.2" ]; then
            mkdir -p result-archive
            gh run download 39888537155 -n cross-paper-v0.7.1-raw -D result-archive
            tar -czf results/v0.7.1-raw-binary-traces.tar.gz -C result-archive traces cross-output
            assets+=(results/v0.7.1-raw-binary-traces.tar.gz)
            test "$(find result-archive/traces -name 'L*.bin' | wc -l)" -eq 9
          fi
          gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "HashFrontier $tag — $title" \
              --notes-file RELEASE_NOTES.md
          fi
