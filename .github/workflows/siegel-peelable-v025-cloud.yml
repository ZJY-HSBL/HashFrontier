name: Siegel 2004 Lemma 2.6 finite peelable XOR graph cloud verification
on:
  push:
    branches: [main]
    paths:
      - 'include/hashfrontier/siegel_peelable_finite.hpp'
      - 'tests/test_siegel_peelable_finite.cpp'
      - 'tests/test_siegel_finite_report.py'
      - 'src/bench_siegel_peelable_finite.cpp'
      - 'scripts/report_siegel_finite_v025.py'
      - '.github/workflows/siegel-peelable-v025-cloud.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finite-siegel-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run full finite k-peelable graph and exact distribution tests
        run: |
          set -euo pipefail
          mkdir -p results/v0.25.0-siegel-finite figures
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_siegel_peelable_finite.cpp -o /tmp/hf-siegel-test
          /tmp/hf-siegel-test | tee results/v0.25.0-siegel-finite/tests.log
          python3 -m unittest discover -s tests -p 'test_siegel_finite_report.py' -v
      - name: Verify address and undefined behavior safety
        run: |
          set -euo pipefail
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_siegel_peelable_finite.cpp -o /tmp/hf-siegel-san
          ASAN_OPTIONS=detect_leaks=1 /tmp/hf-siegel-san
      - name: Benchmark exact 40 finite graph configurations and archive provenance
        run: |
          set -euo pipefail
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Iinclude src/bench_siegel_peelable_finite.cpp -o /tmp/hf-siegel-bench
          /tmp/hf-siegel-bench > results/v0.25.0-siegel-finite/raw.csv
          python3 scripts/report_siegel_finite_v025.py results/v0.25.0-siegel-finite/raw.csv results/v0.25.0-siegel-finite
          cp results/v0.25.0-siegel-finite/hash.svg figures/v0.25.0-siegel-finite-hash.svg
          cp results/v0.25.0-siegel-finite/memory.svg figures/v0.25.0-siegel-finite-memory.svg
          { date -u +'%Y-%m-%dT%H:%M:%SZ'; uname -a; c++ --version | head -1; lscpu | grep -E 'Model name|Architecture|CPU\(s\)' | head -4; } > results/v0.25.0-siegel-finite/environment.txt
          sha256sum include/hashfrontier/siegel_peelable_finite.hpp src/bench_siegel_peelable_finite.cpp results/v0.25.0-siegel-finite/raw.csv > results/v0.25.0-siegel-finite/sha256.txt
      - name: Upload all raw evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siegel-2004-lemma2.6-v025-finite-evidence
          path: |
            results/v0.25.0-siegel-finite/
            figures/v0.25.0-siegel-finite-*.svg
          if-no-files-found: warn
      - name: Commit strictly measured cloud data to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v0.25.0-siegel-finite figures/v0.25.0-siegel-finite-*.svg
          git diff --cached --quiet || {
            git commit -m 'data: archive Siegel Lemma 2.6 finite graph real cloud evidence'
            git push origin HEAD:main
          }
