name: Validate and benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Randomized differential tests
        run: ctest --test-dir build --output-on-failure
      - name: Author-native log audit regression tests
        run: python3 -m unittest discover -s tests -p "test_native_audit.py" -v
      - name: Paired trace instrumentation and audit regressions
        run: python3 -m unittest discover -s tests -p "test_paired_native.py" -v
      - name: HF-Score strict scoring regressions
        run: python3 -m unittest discover -s tests -p "test_hf_score.py" -v
      - name: Frozen environment and paper premise regression
        run: |
          python3 scripts/verify_l3_plan.py
          python3 -m unittest discover -s tests -p "test_reproduction_protocol.py" -v
          python3 scripts/verify_benchmark_host.py --out hf-host-nonformal.json
          python3 scripts/audit_bubble_theorem.py --out hf-bubble-necessary.json
          python3 -c "import json; assert not json.load(open('hf-host-nonformal.json'))['formal_host_eligible']; assert len(json.load(open('hf-bubble-necessary.json'))['results'])==3"

      - name: Verify synthetic demonstration cannot claim measured evidence
        run: |
          python3 scoring/hf_score.py --protocol examples/hfscore/demo-protocol.json --observations examples/hfscore/demo-input.csv --output hfscore-ci.json --csv-output hfscore-ci.csv
          python3 -c "import json; d=json.load(open('hfscore-ci.json')); assert d['evidence_level']=='synthetic_fixture_not_evidence' and d['results'][0]['score']==100"
      - name: Cross-paper strict report regression tests
        run: python3 -m unittest discover -s tests -p "test_cross_paper_report.py" -v
      - name: SODA Advanced Bubble-up paper mechanics pilot smoke
        run: |
          ./build/hf_bubble_paper_benchmark 2 8192 > bubble-advanced-smoke.csv
          test "$(wc -l < bubble-advanced-smoke.csv)" -eq 13
      - name: Small benchmark smoke
        run: ./build/hf_benchmark 100 1 > smoke.csv
      - name: Verify expected number of rows
        run: test "$(wc -l < smoke.csv)" -eq 163
      - name: Churn update-tail smoke
        run: |
          ./build/hf_churn_benchmark 1 2 16 > churn-smoke.csv
          test "$(wc -l < churn-smoke.csv)" -eq 49
      - name: Exact tail smoke validates all 8 algorithms
        run: |
          ./build/hf_churn_benchmark 1 2 16 smoke-tail.csv > /dev/null
          test "$(wc -l < smoke-tail.csv)" -eq 25
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: |
            smoke.csv
            churn-smoke.csv
            smoke-tail.csv
