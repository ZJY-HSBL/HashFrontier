name: Validate and benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Randomized differential tests
        run: ctest --test-dir build --output-on-failure
      - name: Small benchmark smoke
        run: ./build/hf_benchmark 100 1 > smoke.csv
      - name: Verify expected number of rows
        run: test "$(wc -l < smoke.csv)" -eq 163
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: smoke.csv
