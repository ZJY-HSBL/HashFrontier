name: SODA 2025 Advanced Appendix B paper-algorithm reproduction
on:
  push:
    branches: [main]
    paths:
      - 'include/hashfrontier/advanced_bubble_up.hpp'
      - 'include/hashfrontier/advanced_bubble_appendix_c.hpp'
      - 'src/appendix_b_benchmark.cpp'
      - 'tests/test_appendix_b.cpp'
      - 'scripts/plot_appendix_b.py'
      - '.github/workflows/bubble-appendix-b.yml'
  workflow_dispatch:
jobs:
  advanced-appendix-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone paper-algorithm tests and benchmark
        run: |
          mkdir -p out
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_appendix_b.cpp -o out/test-appendix-b
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Iinclude src/appendix_b_benchmark.cpp -o out/bench-appendix-b
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_appendix_b.cpp -o out/test-appendix-b-sanitize
      - name: Validate choice-prime, hash collisions, phase transitions and tombstones
        run: |
          set -euo pipefail
          out/test-appendix-b | tee out/oracle.txt
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 out/test-appendix-b-sanitize | tee out/sanitizer.txt
      - name: Run independent cloud reproduction with identical paired input
        run: |
          set -euo pipefail
          out/bench-appendix-b 10 > out/appendix-b-raw.csv
          python3 scripts/plot_appendix_b.py --input out/appendix-b-raw.csv --summary out/appendix-b-summary.csv --figure-dir out --seeds 10
          { uname -a; g++ --version | head -1; lscpu | grep -E 'Architecture|Model name|CPU\(s\)' | head -6; } > out/environment.txt
          sha256sum out/appendix-b-raw.csv out/appendix-b-summary.csv > out/evidence.sha256
      - name: Archive all cloud observations including failed insertions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soda25-advanced-appendix-b-raw-cloud
          path: out/
          if-no-files-found: error
