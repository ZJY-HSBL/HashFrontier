name: STOC 2025 Partner Hashing Section 3.1 genuine cloud pilot
on:
  push:
    branches: [main]
    paths:
      - 'include/hashfrontier/partner_ram_section3.hpp'
      - 'tests/test_partner_section3.cpp'
      - 'src/bench_partner_section3.cpp'
      - 'scripts/report_partner_section3.py'
      - '.github/workflows/partner-section3-cloud.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paper-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile faithful Section 3 pairing primitive
        run: |
          set -euo pipefail
          mkdir -p /tmp/hf-partner results/stoc25-partner-section3 figures
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_partner_section3.cpp -o /tmp/hf-partner/test
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Iinclude src/bench_partner_section3.cpp -o /tmp/hf-partner/bench
      - name: Run randomized differential and permutation verification
        run: |
          set -euo pipefail
          /tmp/hf-partner/test | tee results/stoc25-partner-section3/tests.log
      - name: Real finite cloud benchmark (45 paired configurations)
        run: |
          set -euo pipefail
          /tmp/hf-partner/bench 5 > results/stoc25-partner-section3/raw.csv
          python3 scripts/report_partner_section3.py --raw results/stoc25-partner-section3/raw.csv --out results/stoc25-partner-section3 --seeds 5
          cp results/stoc25-partner-section3/read.svg figures/stoc25-partner-section3-read.svg
          cp results/stoc25-partner-section3/write.svg figures/stoc25-partner-section3-write.svg
          { date -u +'%Y-%m-%dT%H:%M:%SZ'; uname -a; g++ --version | head -1; lscpu | grep -E 'Model name|Architecture|CPU\(s\)' | head -4; } > results/stoc25-partner-section3/environment.txt
          sha256sum include/hashfrontier/partner_ram_section3.hpp src/bench_partner_section3.cpp results/stoc25-partner-section3/raw.csv > results/stoc25-partner-section3/source-and-data.sha256
      - name: Preserve actual raw experiment data and all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoc25-partner-section3-cloud-evidence
          path: |
            results/stoc25-partner-section3/
            figures/stoc25-partner-section3-*.svg
          if-no-files-found: warn
      - name: Commit measured-only evidence to repository
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/stoc25-partner-section3 figures/stoc25-partner-section3-*.svg
          git diff --cached --quiet || {
            git commit -m 'data: record cloud evidence for STOC25 partner RAM subroutine';
            git push origin HEAD:main;
          }
